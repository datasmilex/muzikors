name: Build & Deploy to App Store (iOS)

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'App Store Connect / TestFlight yüklemesi yapılsın mı?'
        required: true
        type: boolean
        default: true

jobs:
  build-ios:
    name: Build & Sign iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 📥 Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle (npm install)
        run: npm install

      - name: 🏗️ Web Uygulamasını Derle (Next.js Export)
        run: npm run build

      - name: 🔄 Capacitor iOS Senkronizasyonu
        run: npx cap sync ios

      - name: 🚀 Fastlane ile Sertifikaları Yönet, Derle ve Yükle
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          UPLOAD_TO_APP_STORE: ${{ inputs.upload_to_app_store }}
        run: |
          cd ios/App
          fastlane ios release

      - name: 📤 IPA Dosyasını GitHub Artifacts Olarak Kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muzikors-iOS-IPA
          path: ios/App/build/out/*.ipa
          retention-days: 14

