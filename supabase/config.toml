
[functions.spotify-search]
enabled = true
verify_jwt = false
import_map = "./functions/spotify-search/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/spotify-search/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/spotify-search/*.html" ]

[functions.vibe-library]
enabled = true
# Kafe paneli çağırır; anon anahtarı gateway'de, mekân oturum tokenı fonksiyon içinde doğrulanır.
verify_jwt = true
import_map = "./functions/vibe-library/deno.json"
entrypoint = "./functions/vibe-library/index.ts"

[functions.verify-purchase]
enabled = true
# Kullanıcı JWT'si hem gateway'de hem fonksiyon içinde doğrulanır.
verify_jwt = true
import_map = "./functions/verify-purchase/deno.json"
entrypoint = "./functions/verify-purchase/index.ts"

[functions.send-fcm-push]
enabled = true
# Yetki fonksiyon içinde x-admin-token (admin_sessions) ile doğrulanır.
verify_jwt = false
import_map = "./functions/send-fcm-push/deno.json"
entrypoint = "./functions/send-fcm-push/index.ts"

[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/revenuecat-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/revenuecat-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/revenuecat-webhook/*.html" ]
